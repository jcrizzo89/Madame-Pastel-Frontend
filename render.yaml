services:
  - type: web
    name: madame-pastel-frontend
    env: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: build
    dir: frontend
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
